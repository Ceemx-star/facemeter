<style>
/* Layout: тёмная лаборатория. Три шага сверху, фото и точки слева, замеры справа, журнал внизу. */
:root{
  --bg:#0A0A0B; --panel:#141415; --field:#1D1B18; --ink:#F6EEDA; --muted:#A89F88; --line:#3B3322;
  --accent:#D4AF37; --accent-ink:#1A1400; --hot:#F5D77A;
  --good:#6FD9A0; --warn:#E8B94A; --bad:#FF6B81;
  --font-display:"Bricolage Grotesque","Manrope",system-ui,sans-serif;
  --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 48px}
.wrap{max-width:1140px;margin:0 auto}
h1,h2{font-family:var(--font-display);margin:0}
h1{font-size:clamp(46px,11vw,92px);line-height:.92;font-weight:800;letter-spacing:-.035em;margin-top:12px;background:linear-gradient(180deg,#F8E4A0 0%,#D4AF37 55%,#9C7A1E 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
h2{font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted);max-width:60ch;margin-top:16px}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{background:var(--hot);color:#1B1300;border-radius:999px;padding:2px 10px;font-weight:500;letter-spacing:.04em}
.steps{list-style:none;margin:24px 0 0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.st{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:14px}
.st b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--field);font:500 13px var(--font-mono)}
body[data-step="1"] .st1,body[data-step="2"] .st2,body[data-step="3"] .st3{color:var(--ink);border-color:var(--accent)}
body[data-step="1"] .st1 b,body[data-step="2"] .st2 b,body[data-step="3"] .st3 b{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);margin-top:24px}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}
.prompt{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.prompt .txt{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:6px}
.prompt .hint{color:var(--muted);font-size:14px}
.prompt svg{width:92px;height:auto;flex:none}
.prog{height:6px;border-radius:3px;background:var(--field);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.tips{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.tips li{margin:3px 0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:var(--field);border:1px solid var(--line)}
.stage canvas.main{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.stage canvas.main.locked{cursor:default;touch-action:auto}
.loupe{position:absolute;top:10px;left:10px;width:128px;height:128px;border-radius:50%;border:3px solid var(--hot);box-shadow:0 4px 16px rgba(0,0,0,.55);pointer-events:none;overflow:hidden;background:#000;z-index:4}
.loupe.right{left:auto;right:10px}
.loupe canvas{display:block;width:128px;height:128px}
.loupe span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);color:#fff;font-size:10px;line-height:1.2;padding:3px 6px 5px;text-align:center}
.badge{position:absolute;left:12px;bottom:12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600}
.ov{position:absolute;inset:0;z-index:5;background:rgba(7,11,20,.8);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.ov b{display:block;font:700 20px var(--font-display);margin-bottom:8px}
.ov small{display:block;font-size:13px;line-height:1.45;opacity:.92;max-width:36ch;margin:0 auto}
.ov .btn{margin-top:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:700 14px var(--font-body);padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.6;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.btn:focus-within{outline:2px solid var(--hot);outline-offset:2px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.hint2{color:var(--muted);font-size:13px}
.score{display:flex;flex-direction:column;gap:16px}
.scoreTop{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.ring{--p:50;width:116px;height:116px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p) * 1%),var(--field) 0);position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--panel)}
.ring span{position:relative;font:500 40px var(--font-mono);font-variant-numeric:tabular-nums}
.tier{text-align:right;display:flex;flex-direction:column;gap:2px}
.tier b{font-family:var(--font-display);font-size:34px;line-height:1;font-weight:800;letter-spacing:-.02em}
.tier span{font-family:var(--font-mono);font-size:12px;color:var(--muted);max-width:26ch;margin-left:auto}
.meter{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad) 0%,var(--warn) 45%,var(--good) 80%)}
.meter i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--ink);border:4px solid var(--bg);transform:translate(-50%,-50%)}
.legend{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.legend b{color:var(--hot)}
.demo-note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec + .sec{border-top:1px solid var(--line);padding-top:16px;margin-top:6px}
.weak{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.weak li{font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.weak b{font-weight:700}
.weak em{font-style:normal;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .nm{font-weight:700;font-size:14px}
.row .val{font-family:var(--font-mono);font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.row .note{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.row .meta{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-family:var(--font-mono);flex-wrap:wrap}
.row .tr{grid-column:1/-1;height:8px;border-radius:4px;background:var(--field);overflow:hidden;margin-top:3px}
.row .tr i{display:block;height:100%;border-radius:4px}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.fill-good{background:var(--good)} .fill-warn{background:var(--warn)} .fill-bad{background:var(--bad)}
.err{color:var(--bad);font-size:14px;font-weight:600}
.logsec{margin-top:22px}
.log{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:14px 18px}
.log summary{cursor:pointer;font-weight:700}
.log .hint2{margin:8px 0}
.log pre{margin:0 0 10px;max-height:220px;overflow:auto;background:var(--field);border-radius:12px;padding:10px 12px;font:12px/1.5 var(--font-mono);white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.foot{margin-top:24px;color:var(--muted);font-size:13px;max-width:80ch;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:no-preference){.prog i,.meter i,.row .tr i{transition:width .25s ease,left .25s ease}}

/* ---- Плавность и анимации ---- */
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.tip{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tip b{font-size:14px}.tip p{font-size:13.5px;color:var(--muted);line-height:1.5}
.tip .tag{font:500 10.5px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--hot)}
.tips2{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.srcs summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
.srcs ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.srcs a{color:var(--hot)}
.scan{position:absolute;left:0;right:0;top:0;height:22%;pointer-events:none;z-index:3;background:linear-gradient(180deg,transparent,rgba(212,175,55,.32));border-bottom:2px solid rgba(245,215,122,.9)}
@keyframes rise{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes mv{from{left:2%}}
@keyframes pop{from{opacity:0;transform:scale(.94) translate3d(0,8px,0)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes photoIn{from{opacity:0;transform:scale(1.045)}to{opacity:1;transform:none}}
@keyframes glow{0%{box-shadow:0 0 0 rgba(212,175,55,0)}40%{box-shadow:0 0 38px rgba(212,175,55,.5)}100%{box-shadow:0 0 0 rgba(212,175,55,0)}}
@keyframes sheen{0%{filter:brightness(2.4)}100%{filter:none}}
@keyframes scan{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,360%,0)}}
@media (prefers-reduced-motion:no-preference){
  header>*{animation:rise .75s var(--ease) both}
  header .eyebrow{animation-delay:.02s}header h1{animation:rise .75s var(--ease) .08s both,sheen 1.9s ease .25s both}header .steps{animation-delay:.16s}
  .col>*{animation:rise .75s var(--ease) both}
  .col>*:nth-child(2){animation-delay:.07s}.col>*:nth-child(3){animation-delay:.14s}
  .btn{transition:transform .35s var(--ease),background-color .25s,border-color .25s,opacity .25s}
  .btn:active{transform:scale(.95)}
  .st{transition:color .3s,border-color .3s}.st b{transition:background-color .3s,color .3s}
  .prompt .txt,.prompt svg{animation:fade .35s ease both}
  .enter>*{animation:rise .7s var(--ease) both}
  .enter>*:nth-child(1){animation-delay:0.38s}.enter>*:nth-child(2){animation-delay:0.45s}.enter>*:nth-child(3){animation-delay:0.52s}.enter>*:nth-child(4){animation-delay:0.59s}.enter>*:nth-child(5){animation-delay:0.66s}.enter>*:nth-child(6){animation-delay:0.73s}.enter>*:nth-child(7){animation-delay:0.80s}.enter>*:nth-child(8){animation-delay:0.87s}
  .enter .row .tr i{transform-origin:left;animation:grow 1.1s var(--ease) .8s both}
  .enter .meter i{animation:mv 1.1s var(--ease) .75s both}
  .pop{animation:pop .55s var(--spring) both}
  .flash{animation:photoIn .75s var(--ease) both}
  .enter .tier b{animation:pop .8s var(--spring) .7s both}
  .enter .ring{animation:glow 1.8s ease .45s both}
  .enter .legend{animation:fade .8s ease .9s both}
  .scan{animation:scan 1.7s ease-in-out infinite alternate}
  .prog i,.meter i,.row .tr i{transition:width .45s var(--ease),left .45s var(--ease)}
}
@media (prefers-reduced-motion:reduce){.scan{display:none}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Лукс-анализ лица · шкала PSL <span class="chip">версия 11 · 468 точек</span></div>
    <h1>Фейсметр</h1>
    <ol class="steps"><li class="st st1"><b>1</b>Фото</li><li class="st st2"><b>2</b>Точки</li><li class="st st3"><b>3</b>Результат</li></ol>
  </header>

  <main class="grid">
    <section class="col">
      <div class="panel prompt" id="prompt"></div>
      <div class="stage">
        <div class="scan" id="scan" hidden></div>
        <canvas class="main locked" id="cv" width="600" height="780" aria-label="Фото с отмеченными точками"></canvas>
        <div class="loupe" id="loupe" hidden><canvas id="lc" width="128" height="128"></canvas><span id="ll"></span></div>
        <div class="badge" id="badge">Пример на схеме</div>
        <div class="ov" id="ov" hidden><div><b id="ovT">ИИ работает</b><small id="ovS"></small><button class="btn" id="ovStop" type="button">Стоп</button></div></div>
      </div>
      <div class="toolbar" id="toolbar">
        <div class="btn filebtn primary" id="pick"><span id="pickT">Выбрать фото</span><input id="file" type="file" accept="image/*" aria-label="Выбрать фото"></div>
        <div class="btn filebtn" id="camBtn"><span>Снять на камеру</span><input id="cam" type="file" accept="image/*" capture="user" aria-label="Снять на камеру"></div>
        <button class="btn primary" id="meshBtn" type="button" hidden>Авто-расстановка (468 точек)</button>
        <button class="btn" id="aiBtn" type="button" hidden>Расставить точки с ИИ (Claude)</button>
        <button class="btn" id="aiStop" type="button" hidden>Стоп</button>
        <button class="btn" id="undo" type="button" hidden>Назад на точку</button>

      <p class="hint2" id="aiMsg" hidden></p>
    </section>

    <section class="col">
      <div class="panel" id="results"></div>
    </section>
  </main>
</div>

    ['hair','glab','sub','men'].forEach(function(id){ln(P[IDX[id]],ux,uy,'rgba(212,175,55,.55)',Math.max(1,W/700));});
    var cx=0,cy=0,pr=[['pupL','pupR'],['medL','medR'],['latL','latR'],['zygL','zygR'],['goL','goR'],['mouL','mouR'],['alL','alR']];

    cx/=pr.length;cy/=pr.length;

  fm.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.5,minTrackingConfidence:0.5,selfieMode:false});

          +'Текущие точки могут сдвинуться на несколько пикселей от нужного места. Для каждой точки проверь, лежит ли центр кружка ровно там, где должна быть точка, и верни исправленное положение. Если положение верное, верни то же самое.\n'
          +'Координаты у каждого изображения свои: x и y в системе 0–1000 относительно ширины и высоты ИМЕННО ЭТОГО изображения, (0,0) левый верхний угол. «Слева» и «справа» это стороны изображения.\n'
          +'Определения точек:\n'+def+'\n'
          +'Верни только JSON: {"eyes":{'+eyesIds.map(function(i){return '"'+i+'":[x,y]';}).join(',')+'},"lower":{'+lowIds.map(function(i){return '"'+i+'":[x,y]';}).join(',')+'},"full":{'+fullIds.map(function(i){return '"'+i+'":[x,y]';}).join(',')+'}}. Группа eyes относится к изображению 2, lower к изображению 3, full к изображению 1.';
        var r2=await askJson(p2,{images:blobs,modelTier:'complex',cache:false,signal:aiCtl.signal});
        var Q=P.map(function(p){return {x:p.x,y:p.y};});
        var apply=function(group,ids,rc){
          if(!group)return;
          ids.forEach(function(id){
            var v=group[id];if(!Array.isArray(v)||!isFinite(v[0])||!isFinite(v[1]))return;
            var x=rc.x+Math.max(0,Math.min(1000,+v[0]))/1000*rc.w,y=rc.y+Math.max(0,Math.min(1000,+v[1]))/1000*rc.h,old=Q[IDX[id]];
            if(Math.hypot(x-old.x,y-old.y)<=0.06*Math.max(W,H))Q[IDX[id]]={x:x,y:y};
          });
        };
        apply(r2&&r2.eyes,eyesIds,rE);apply(r2&&r2.lower,lowIds,rL);apply(r2&&r2.full,fullIds,rF);
        if(!analyze(Q).error){pts=Q;update();}
      }catch(e2){
        if(e2&&e2.code==='cancelled')throw e2;
        aiNote('Шаг 2 не удался, оставлена первая расстановка.');
        return;
      }
    }
    aiNote('Готово. ИИ может ошибаться на несколько пикселей: проверьте точки через лупу и поправьте. Числа справа пересчитываются сразу.');
  }catch(e){
    var c=e&&e.code;
    log('Ошибка ИИ: '+(c||'')+' '+((e&&e.message)||e));
    if(c==='cancelled'){aiNote('Остановлено.');}
    else{aiNote('');msg((AIERR[c]||'ИИ не ответил. Нажмите ещё раз или расставьте точки вручную.')+' Технически: '+(c||(e&&e.name)||'ошибка')+(e&&e.message?' — '+e.message:'')+'.');}
  }finally{clearTimeout(hint);aiBusy=false;aiCtl=null;syncAi();}
}
